<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>jerryxf</title>
    <meta name="description" content="Hi there, I'm Jerry." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Kept in sync with the resolved theme -->
    <meta name="theme-color" content="#fbfaf9" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="jerryxf" />
    <meta property="og:description" content="Hi there, I'm Jerry." />
    <meta property="og:url" content="https://jerryxf.net/" />
    <meta property="og:image" content="https://jerryxf.net/android-chrome512.png" />
    <meta property="og:site_name" content="jerryxf" />

    <!-- Theme init runs synchronously before first paint to fix FOUC -->
    <script>
        (function () {
            let stored = null;
            try {
                stored = localStorage.getItem("themeName");
            } catch (e) {
            }
            // in sync with THEMES in src/context/ThemeContext.tsx
            const themes = ["light", "night", "pink"];

            const pref = (themes.indexOf(stored) !== -1 || stored === "auto") ? stored : "light";

            const theme = pref === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light")
                : pref;

            document.documentElement.setAttribute("data-theme", theme);
            // Firefox paints before external CSS resolves custom properties, so cover the gap inline.
            // These must match --bg for each theme in index.scss.
            const boot = {light: "#fbfaf9", night: "#101010", pink: "#fff7fb"};
            document.documentElement.style.background = boot[theme];

            // Apply same value to prevent FOUC from OS theme.
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute("content", boot[theme]);
        })();
    </script>
    <script>
        (function () {
            const hour = new Date().getHours();
            const isNight = hour >= 22 || hour < 6;
            if (!isNight) return;

            const ov = document.createElement("div");
            ov.id = "boot-overlay";
            ov.style.cssText = "position:fixed;inset:0;z-index:9999;pointer-events:none;background:#000;opacity:0.30;";
            document.documentElement.appendChild(ov);

            setTimeout(function () {
                ov.style.transition = "opacity 1.5s ease-out";
                ov.style.opacity = "0";
                setTimeout(function () {
                    ov.remove();
                }, 3000);
            }, 250);
        })();
    </script>
    <link rel="preconnect" href="https://github-stats.jerryxf.net" crossorigin>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
