<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Title, description, address: each page's own, written here by the build from src/head.ts -->
    <!-- page head -->
    <!-- Kept in sync with the resolved theme -->
    <meta name="theme-color" content="#fbfaf9" />

    <!-- Link previews: the same picture and site name on every page -->
    <meta property="og:image" content="https://jerryxf.net/android-chrome512.png" />
    <meta property="og:site_name" content="jerryxf" />
    <meta name="twitter:card" content="summary" />

    <!-- Theme init runs synchronously before first paint to fix FOUC -->
    <script>
        (function () {
            let stored = null;
            try {
                stored = localStorage.getItem("themeName");
            } catch (e) {
            }
            // Every theme in THEME_INFO (src/context/ThemeContext.tsx): its background, which must match its --bg in
            // index.scss (Firefox paints before external CSS resolves custom properties, so it covers the gap inline),
            // and whether it's dark.
            const boot = {
                light: {bg: "#fbfaf9"},
                night: {bg: "#101010", dark: true},
                blush: {bg: "#fff7fb"},
                burgundy: {bg: "#200c14", dark: true},
                glacier: {bg: "#f8fafc"},
                latte: {bg: "#fbf8f4"},
            };

            const pref = (Object.hasOwn(boot, stored) || stored === "auto") ? stored : "light";

            const theme = pref === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light")
                : pref;

            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-scheme", boot[theme].dark ? "dark" : "light");
            document.documentElement.style.background = boot[theme].bg;

            // Apply same value to prevent FOUC from OS theme.
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute("content", boot[theme].bg);
        })();
    </script>
    <script>
        (function () {
            const hour = new Date().getHours();
            const isNight = hour >= 22 || hour < 6;
            if (!isNight) return;

            const ov = document.createElement("div");
            ov.id = "boot-overlay";
            ov.style.cssText = "position:fixed;inset:0;z-index:9999;pointer-events:none;background:#000;opacity:0.30;";
            document.documentElement.appendChild(ov);

            setTimeout(function () {
                ov.style.transition = "opacity 1.5s ease-out";
                ov.style.opacity = "0";
                setTimeout(function () {
                    ov.remove();
                }, 3000);
            }, 250);
        })();
    </script>
    <link rel="preconnect" href="https://github-stats.jerryxf.net" crossorigin>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
